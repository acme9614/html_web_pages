<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shegaonkar Jewellers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>

<body class="bg-gray-100">

    <!-- HEADER -->
    <header class="bg-white shadow-xl fixed top-0 left-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-4 py-1 flex items-center justify-between">

            <!-- Left -->
            <div class="flex items-center gap-3">

                <!-- Menu -->
                <button id="menuBtn"
                    class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition"
                    aria-label="Menu">

                    <span class="flex flex-col gap-1">
                        <span class="w-6 h-0.5 bg-black"></span>
                        <span class="w-6 h-0.5 bg-black"></span>
                        <span class="w-6 h-0.5 bg-black"></span>
                    </span>

                </button>

                <!-- Logo -->
                <img src="assets/Footer_logo.webp" alt="Logo"
                    class="h-12 sm:h-14 md:h-16 lg:h-20 w-auto object-contain">

            </div>

            <!-- Right -->
            <div class="flex items-center gap-2 sm:gap-3">

                <!-- Notification -->
                <button onclick="navigateToNotification()" aria-label="Notification"
                    class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition">

                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-black" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0a3 3 0 11-6 0h6z" />

                    </svg>

                </button>

                <!-- Logout -->
                <button onclick="navigateToLogout()" aria-label="Logout"
                    class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition">

                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-black" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 17l5-5-5-5" />

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12H9" />

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 19H7a2 2 0 01-2-2V7a2 2 0 012-2h5" />

                    </svg>

                </button>

            </div>

        </div>
    </header>

    <!-- OVERLAY -->
    <div id="overlay" class="fixed inset-0 bg-black/40 opacity-0 invisible transition-all duration-300 z-40">
    </div>

    <!-- DRAWER -->
    <aside id="drawer" class="fixed top-0 right-0 w-72 h-screen bg-white shadow-lg
           transform translate-x-full transition-transform duration-300
           z-50 flex flex-col">

        <!-- Header -->
        <div class="flex items-center justify-between p-4 border-b flex-shrink-0">
            <img src="assets/Footer_logo.webp" alt="Logo" class="h-20 w-auto">
            <button id="closeBtn" class="text-2xl leading-none">&times;</button>
        </div>

        <!-- Scrollable Menu -->
        <div id="drawerContainer" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
        </div>

    </aside>

    <!-- BANNER SECTION -->
    <section class="w-full">
        <div class="swiper brandingSwiper pt-12">

            <div class="swiper-wrapper">

                <div class="swiper-slide">
                    <!-- Desktop -->
                    <img src="assets/shegoankrr_banner.webp" alt="Banner Desktop"
                        class="w-full object-cover hidden md:block" />

                    <!-- Mobile -->
                    <img src="assets/mobileView.webp" alt="Banner Mobile" class="w-full object-cover block md:hidden" />
                </div>

                <!-- Add more local banners here if needed -->

            </div>

            <div class="swiper-pagination"></div>

        </div>
    </section>

    <!-- Service Section -->
    <section class="py-12 px-4 bg-white">

        <div class="max-w-3xl mx-auto">
            <!-- widgets container -->
            <div id="widgetsContainer" class="flex flex-wrap justify-center gap-6 md:gap-12">
            </div>
        </div>

    </section>

    <!-- FOOTER -->
    <footer class="bg-white py-6">

        <div class="max-w-7xl mx-auto px-4 flex justify-center items-center">

            <!-- LOGO -->
            <img src="assets/Footer_logo.webp" alt="Logo" class="h-44 md:h-auto w-auto">

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <!-- SCRIPT -->
    <script src="script.js">
    </script>

    <script>
        // Drawer Items Display
        window.renderDrawerItem = function (widget) {
            return `
      <a href="#"
         onclick="${widget.action}()"
         class="text-gray-700 hover:text-black transition">
         ${widget.name}
      </a>
    `;
        };

        // widget tabs display
        window.renderWidget = function (widget) {
            const isVirtualTryOn = Number(widget.id) === 23;
            return `
    <div onclick="${widget.action}()"
    class="h-28 w-24 md:w-28 md:h-28 rounded-tl-[50px] rounded-tr-[50px] rounded-bl-[50px]
    flex flex-col items-center justify-center text-center shadow-md text-white cursor-pointer
    border-4 border-yellow-400 bg-gradient-to-br from-[#c7b3ea] via-[#8965c4] to-[#4b2a8a]">
      
      <img class="w-10 h-10 ${isVirtualTryOn ? '' : 'invert'}" src="${widget.icon}" />
      <span class="text-xs md:text-sm lg:text-base md:font-semibold mt-2 w-20 leading-tight break-words">${widget.name}</span>
    </div>
  `;
        };
    </script>
    <!-- 
     This file dynamically renders service tabs and drawer items
     based on widgets.json config, so no need to manually update each page -->
    <script src="https://acme9614.github.io/html_web_pages/widgets-core.js"></script>

</body>

</html>
